<!-- isailetisim influencer takibi: index.html'de </body>'den hemen önce yapıştır -->
<script>
(function(){
  var K='yref', RE=/^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$/;
  function getC(){var m=document.cookie.match(/(?:^|;\s*)yref=([^;]+)/);return m?decodeURIComponent(m[1]):''}
  var ref=(new URLSearchParams(location.search).get('ref')||'').toLowerCase();
  if(RE.test(ref)){document.cookie=K+'='+ref+';max-age=2592000;path=/;samesite=lax'+(location.protocol==='https:'?';secure':'')}
  else ref=getC();
  if(!RE.test(ref))ref='';
  // Influencer'dan gelindiyse yasomi.com.tr linklerine utm_content=<ref> ekle (Ticimax raporunda görünsün)
  if(ref)[].forEach.call(document.querySelectorAll('a[href*="yasomi.com.tr"]'),function(a){
    try{var u=new URL(a.href);if(/(^|\.)yasomi\.com\.tr$/.test(u.hostname)){u.searchParams.set('utm_content',ref);a.href=u.toString()}}catch(_){}
  });
  // Dışarı giden her tıklamayı /api/click'e bildir (sayfa kapansa da gider)
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="http"]');if(!a)return;
    var host='';try{host=new URL(a.href).hostname.replace(/^www\./,'')}catch(_){}
    var body=JSON.stringify({target:a.dataset.track||a.dataset.t||host,ref:ref,href:a.href,page_ts:Date.now()});
    try{if(navigator.sendBeacon&&navigator.sendBeacon('/api/click',new Blob([body],{type:'application/json'})))return}catch(_){}
    try{fetch('/api/click',{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'application/json'}})}catch(_){}
  },{capture:true,passive:true});
})();
</script>
