name = "isailetisim"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Canlıya alırken (isailetisim.com zone'u Cloudflare hesabında olmalı) bu satırı aç:
# routes = [{ pattern = "isailetisim.com", custom_domain = true }]

[assets]
directory = "../"
binding = "ASSETS"
# Bu yollar önce Worker'a gider; gerisi statik dosya. Eşleşmeyen yol Worker'a düşer (/:code kısayolu, yoksa 404).
run_worker_first = ["/i/*", "/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "isailetisim"
# `npx wrangler d1 create isailetisim` çıktısındaki database_id'yi buraya yapıştır
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
