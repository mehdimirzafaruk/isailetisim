name = "isailetisim"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# 28 Ekim 2026: kanonik alan adı yasomi.net. isailetisim.com (ve www) /api/* dışında yasomi.net'e 301 verir
# (src/index.js); /api/* iki alan adında da çalışır (canlı Ticimax postback'i eski adresi kullanıyor).
# Sıra önemli: `wrangler dev` ilk route'u yerel origin sayar; isailetisim.com ilk olursa yerelde her şey 301 olur.
routes = [
  { pattern = "yasomi.net", custom_domain = true },
  { pattern = "www.yasomi.net", custom_domain = true },
  { pattern = "isailetisim.com", custom_domain = true },
  { pattern = "www.isailetisim.com", custom_domain = true }
]

[vars]
# Panelde, Ticimax betiğinde, kanal/influencer linklerinde gösterilen adres. Sonda / yok.
SITE_ORIGIN = "https://yasomi.net"

[assets]
directory = "../"
binding = "ASSETS"
# Bu yollar önce Worker'a gider; gerisi statik dosya. Eşleşmeyen yol Worker'a düşer (/:code kısayolu, yoksa 404).
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "isailetisim"
# `npx wrangler d1 create isailetisim` çıktısındaki database_id'yi buraya yapıştır
database_id = "34634dba-971a-4bd6-b870-64fb05e4ba14"
migrations_dir = "migrations"

[observability]
enabled = true
